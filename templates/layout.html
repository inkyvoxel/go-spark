<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ .Title }}</title>
  <link rel="icon" href="{{ .Routes.StaticFaviconSVG }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ .Routes.StaticPicoCSS }}">
  <link rel="stylesheet" href="{{ .Routes.StaticStyles }}">
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><strong><a href="{{ .Routes.Home }}">Go Spark</a></strong></li>
      </ul>
      <ul>
        {{ if .Authenticated }}
        <li><a href="{{ .Routes.Projects }}">Projects</a></li>
        <li><a href="{{ .Routes.Account }}">Account</a></li>
        <li><button form="logout-form">Sign out</button></li>
        {{ else }}
        <li><a href="{{ .Routes.Login }}">Sign in</a></li>
        <li><a href="{{ .Routes.Register }}">Create account</a></li>
        {{ end }}
      </ul>
    </nav>
    {{ if .Authenticated }}
    <form id="logout-form" method="post" action="{{ .Routes.Logout }}" hidden>
    </form>
    {{ end }}
  </header>
  <main>
    {{ template "flash" . }}
    {{ template "content" . }}
  </main>
  {{ block "scripts" . }}{{ end }}
</body>

</html>
